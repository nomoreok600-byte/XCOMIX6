<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XCOMIX · Admin</title>
<style>
  :root { --bg:#0a0a12; --panel:#14141f; --line:#262636; --txt:#e8e8f0; --muted:#9a9ab0; --accent:#a855f7; --accent2:#06b6d4; --ok:#22c55e; --warn:#eab308; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; position:sticky; top:0; background:rgba(10,10,18,.9); backdrop-filter:blur(8px); z-index:5; }
  header h1 { font-size:18px; margin:0; letter-spacing:2px; }
  header h1 b { color:var(--accent); }
  .badge { font-size:11px; color:var(--muted); border:1px solid var(--line); padding:3px 8px; border-radius:20px; }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input, select, button { font:inherit; }
  input, select { background:#0e0e18; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:9px 11px; }
  button { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:0; border-radius:8px; padding:9px 16px; cursor:pointer; font-weight:600; }
  button.ghost { background:#1b1b29; border:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin:18px 0; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat .n { font-size:30px; font-weight:800; }
  .stat .l { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-top:4px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin:18px 0; }
  .panel h2 { margin:0 0 12px; font-size:15px; letter-spacing:1px; color:var(--accent2); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  .log { background:#06060c; border:1px solid var(--line); border-radius:8px; padding:12px; font-family:ui-monospace,monospace; font-size:12px; white-space:pre-wrap; max-height:280px; overflow:auto; color:#bdf; }
  .pill { font-size:11px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }
  .hidden { display:none; }
  a { color:var(--accent2); }
</style>
</head>
<body>
<header>
  <h1><b>XCOMIX</b> ADMIN</h1>
  <span class="badge" id="sched-badge">scheduler: …</span>
  <span style="flex:1"></span>
  <button class="ghost" id="logout">Change token</button>
</header>

<main>
  <div id="gate" class="panel">
    <h2>Admin token</h2>
    <p style="color:var(--muted)">Enter the <code>ADMIN_TOKEN</code> from the backend <code>.env</code>.</p>
    <div class="row">
      <input id="token" type="password" placeholder="admin token" style="flex:1;min-width:240px" />
      <button id="unlock">Unlock</button>
    </div>
    <p id="gate-err" style="color:var(--err)"></p>
  </div>

  <div id="app" class="hidden">
    <div class="grid" id="stats"></div>

    <div class="panel">
      <h2>Auto importer (no human)</h2>
      <p style="color:var(--muted)" id="sched-info"></p>
      <div class="row" style="margin-bottom:12px">
        <select id="run-sources">
          <option value="katana,buddy">Katana + Buddy</option>
          <option value="katana">MangaKatana only</option>
          <option value="buddy">ManhwaBuddy only</option>
        </select>
        <input id="run-limit" type="number" value="6" min="1" max="30" style="width:90px" title="manga per source" />
        <button id="run-latest">Run latest crawl now</button>
      </div>
      <div class="row">
        <input id="import-url" placeholder="https://mangakatana.com/manga/... or manhwabuddy.com/manhwa/..." style="flex:1;min-width:280px" />
        <button id="import-url-btn">Import URL</button>
      </div>
      <div class="log" id="log" style="margin-top:12px">Ready.</div>
    </div>

    <div class="panel">
      <h2>Recently updated manga</h2>
      <table><thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Source</th><th>Chapters</th><th>Updated</th></tr></thead>
      <tbody id="recent-manga"></tbody></table>
    </div>

    <div class="row" style="gap:18px;align-items:flex-start">
      <div class="panel" style="flex:1">
        <h2>Newest users</h2>
        <table><thead><tr><th>User</th><th>Role</th><th>Joined</th></tr></thead><tbody id="recent-users"></tbody></table>
      </div>
      <div class="panel" style="flex:1">
        <h2>Latest comments</h2>
        <table><thead><tr><th>User</th><th>Comment</th></tr></thead><tbody id="recent-comments"></tbody></table>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let TOKEN = localStorage.getItem("xcomix_admin_token") || "";

async function api(path, opts = {}) {
  const res = await fetch("/admin" + path, {
    ...opts,
    headers: { "Content-Type": "application/json", "X-Admin-Token": TOKEN, ...(opts.headers || {}) },
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || ("HTTP " + res.status));
  return res.json();
}

function log(msg) {
  const el = $("#log");
  el.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg + "\n" + el.textContent;
}

const STAT_DEFS = [
  ["mangas", "Manga"], ["chapters", "Chapters"], ["pages", "Pages"], ["completed", "Completed"],
  ["adult", "18+"], ["genres", "Genres"], ["users", "Users"], ["comments", "Comments"],
  ["reviews", "Reviews"], ["library", "Bookmarks"], ["messages", "Messages"], ["notifications", "Notifs"],
];

async function refresh() {
  const stats = await api("/stats");
  $("#stats").innerHTML = STAT_DEFS.map(
    ([k, l]) => `<div class="stat"><div class="n">${stats.totals[k] ?? 0}</div><div class="l">${l}</div></div>`
  ).join("");
  const bySrc = stats.by_source.map((s) => `${s.source}: ${s.count}`).join(" · ");
  $("#sched-info").textContent =
    `Status: ${stats.scheduler.enabled ? "ENABLED" : "disabled"} · every ${stats.scheduler.intervalMin}m · sources ${stats.scheduler.sources.join(",")} · runs ${stats.scheduler.runs} · last ${stats.scheduler.lastRun || "never"} · catalog by source → ${bySrc}`;
  $("#sched-badge").textContent = "scheduler: " + (stats.scheduler.running ? "running" : stats.scheduler.enabled ? "armed" : "off");

  const r = await api("/recent");
  $("#recent-manga").innerHTML = r.manga.map((m) =>
    `<tr><td>${esc(m.title)}</td><td><span class="pill">${m.type}</span></td><td>${m.status}</td><td>${m.source || "—"}</td><td>${m.chapters}</td><td>${fmt(m.updated_at)}</td></tr>`
  ).join("") || `<tr><td colspan="6">No manga yet.</td></tr>`;
  $("#recent-users").innerHTML = r.users.map((u) =>
    `<tr><td>${esc(u.username)}</td><td>${u.role}</td><td>${fmt(u.created_at)}</td></tr>`
  ).join("") || `<tr><td colspan="3">No users yet.</td></tr>`;
  $("#recent-comments").innerHTML = r.comments.map((c) =>
    `<tr><td>${esc(c.username)}</td><td>${esc((c.body || "").slice(0, 60))}</td></tr>`
  ).join("") || `<tr><td colspan="2">No comments yet.</td></tr>`;
}

const esc = (s) => String(s == null ? "" : s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const fmt = (d) => d ? new Date(d).toLocaleString() : "—";

async function boot() {
  try { await refresh(); $("#gate").classList.add("hidden"); $("#app").classList.remove("hidden"); }
  catch (e) { $("#gate").classList.remove("hidden"); $("#app").classList.add("hidden"); if (TOKEN) $("#gate-err").textContent = e.message; }
}

$("#unlock").onclick = async () => {
  TOKEN = $("#token").value.trim();
  localStorage.setItem("xcomix_admin_token", TOKEN);
  $("#gate-err").textContent = "";
  boot();
};
$("#logout").onclick = () => { localStorage.removeItem("xcomix_admin_token"); TOKEN = ""; location.reload(); };

$("#run-latest").onclick = async () => {
  try {
    await api("/import/run", { method: "POST", body: JSON.stringify({ sources: $("#run-sources").value, limit: Number($("#run-limit").value) }) });
    log("Latest crawl started in background. Refreshing stats every 8s…");
    let n = 0; const t = setInterval(async () => { await refresh(); if (++n > 10) clearInterval(t); }, 8000);
  } catch (e) { log("ERROR: " + e.message); }
};
$("#import-url-btn").onclick = async () => {
  const url = $("#import-url").value.trim();
  if (!url) return;
  log("Importing " + url + " …");
  try { const r = await api("/import/url", { method: "POST", body: JSON.stringify({ url }) }); log("OK: " + JSON.stringify(r.result)); refresh(); }
  catch (e) { log("ERROR: " + e.message); }
};

if (TOKEN) $("#token").value = TOKEN;
boot();
</script>
</body>
</html>
